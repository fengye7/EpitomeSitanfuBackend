version: '3'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000"  # 明确映射到主机端口 8000
    volumes:
      - .:/app  # 仅挂载项目根目录
      - ./environment/frontend_server/storage:/app/environment/frontend_server/storage
      - ./environment/frontend_server/compressed_storage:/app/environment/frontend_server/compressed_storage
    working_dir: /app/environment/frontend_server  # 直接进入 Django 项目目录
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/environment  # 关键：让 Python 能找到 frontend_server 模块
    restart: unless-stopped
    command: >
      gunicorn --bind 0.0.0.0:8000 
      --workers 4 
      --timeout 120 
      frontend_server.wsgi:application  # 直接引用 frontend_server 模块

  nginx:
    image: nginx:latest
    ports:
      - "${EXPOSE_WEB_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./environment/frontend_server/storage:/app/environment/frontend_server/storage
      - ./environment/frontend_server/compressed_storage:/app/environment/frontend_server/compressed_storage
    depends_on:
      - backend
    restart: always
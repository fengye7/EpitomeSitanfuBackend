upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name yourdomain.com;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        alias /generative_agents/environment/frontend_server/storage;
    }

    location /compressed_storage/ {
        alias /generative_agents/environment/frontend_server/compressed_storage;
    }
}